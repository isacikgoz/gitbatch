version: 2

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/gitbatch
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    ldflags:
      - -s -w -X main.version={{ .Version }}

brews:
  - repository:
      owner: isacikgoz
      name: homebrew-taps
    homepage: "{{ .GitURL }}"
    description: Manage your git repositories in one place
